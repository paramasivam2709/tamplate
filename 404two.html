<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>404 - Page Not Found</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Main CSS -->
<link rel="stylesheet" href="css/style.css">

<style>
  .error-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: #0BCEAF;
    color: #fff;
  }
  .error-box h1 {
    font-size: 120px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .error-box h2 {
    font-size: 32px;
    margin-bottom: 15px;
  }
  .error-box p {
    margin-bottom: 25px;
    font-size: 18px;
  }
  .error-box a {
    padding: 12px 30px;
    background: #fff;
    color: #0BCEAF;
    border-radius: 30px;
    text-decoration: none;
    font-weight: 600;
  }
  .error-box a:hover {
    background: #f1f1f1;
  }
</style>
</head>

<body>

<div class="error-page">
  <div class="error-box">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you are looking for doesn’t exist or was moved.</p>
    <a href="index (2).html">Go Back Home</a>
  </div>
</div>

</body>
</html>
